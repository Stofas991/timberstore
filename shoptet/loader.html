<!--
  Timberstore loader — the ONLY custom code pasted into Shoptet
  (Administrace → Vzhled a obsah → Editor HTML kódu → Záhlaví).
  Production version = PROD. Change it only here. See CONTRIBUTING.md 3.1.
-->
<script>
(function () {
  /* jshint evil: true */ // document.write below is intentional (render-blocking CSS)
  var BASE = 'https://cdn.jsdelivr.net/gh/Timberstore/timberstore@';
  var PROD = ''; // ← production version ('' = off for customers, only ?ts_preview loads)
  var q = location.search.match(/[?&]ts_preview=([\w.\-]+)/);
  if (q) {
    document.cookie = q[1] === 'off' ? 'ts_preview=; max-age=0; path=/' : 'ts_preview=' + q[1] + '; max-age=604800; path=/';
  }
  var c = document.cookie.match(/(?:^|; )ts_preview=([\w.\-]+)/);
  var ok = c && /^(v\d+\.\d+\.\d+(-rc\.\d+)?|[0-9a-f]{7,40})$/.test(c[1]);
  var v = ok ? c[1] : PROD;
  window.TimberLoader = { version: v, preview: !!ok };
  if (!v) return;
  // CSS via document.write: parser-inserted, so it blocks render (no flash of unstyled content)
  document.write('<link rel="stylesheet" href="' + BASE + v + '/dist/timber.min.css">');
  // JS as a script element: never blocks rendering. (No "<script" inside a string — the Shoptet editor's linter breaks on it.)
  var s = document.createElement('script');
  s.src = BASE + v + '/dist/timber.min.js';
  document.head.appendChild(s);
})();
</script>
